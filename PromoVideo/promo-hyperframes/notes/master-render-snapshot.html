<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>CareData Promo · Master Composition</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  /* Master root absolute-positioned so sub-comps stack via inset:0 */
  #master-root {
    position: relative;
    width: 3840px;
    height: 2160px;
    overflow: hidden;
    background: #000;
  }
  /* Each sub-composition fills the master frame; Hyperframes hides
     inactive clips automatically via class="clip" visibility rules. */
  #master-root > .clip {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<!-- HF-COMP gen v1 -->
<div id="master-root" data-composition-id="master" data-width="3840" data-height="2160" data-start="0" data-duration="81.18">
  <!-- Music bed muxed at master concat time, not embedded here. SFX (typing/click/whoosh) baked into individual scene mp4s via embedded <audio>. -->
  <!-- 16 sub-compositions. Each .clip is itself the composition host carrying
       data-composition-id (matching the sub-comp slug) and data-composition-src.
       Track index alternates 0/1 so abutting clips never share a track,
       eliminating floating-point boundary overlaps on the same track. -->
  <div id="clip-hook"               class="clip" data-composition-id="hook"               data-composition-src="compositions/01-hook.html"               data-start="0.00"  data-duration="4.50"  data-track-index="0"></div>
  <div id="clip-logo-reveal"        class="clip" data-composition-id="logo-reveal"        data-composition-src="compositions/02-logo-reveal.html"        data-start="4.50"  data-duration="3.00"  data-track-index="1"></div>
  <div id="clip-hero"               class="clip" data-composition-id="hero"               data-composition-src="compositions/03-hero.html"               data-start="7.50"  data-duration="3.00"  data-track-index="0"></div>
  <div id="clip-upload"             class="clip" data-composition-id="upload"             data-composition-src="compositions/04-upload.html"             data-start="10.50" data-duration="4.50"  data-track-index="1"></div>
  <div id="clip-dashboard"          class="clip" data-composition-id="dashboard"          data-composition-src="compositions/05-dashboard.html"          data-start="15.00" data-duration="6.80"  data-track-index="0"></div>
  <div id="clip-pi-drilldown"       class="clip" data-composition-id="pi-drilldown"       data-composition-src="compositions/06-pi-drilldown.html"       data-start="21.80" data-duration="4.50"  data-track-index="1"></div>
  <div id="clip-benchmarking"       class="clip" data-composition-id="benchmarking"       data-composition-src="compositions/07-benchmarking.html"       data-start="26.30" data-duration="5.50"  data-track-index="0"></div>
  <div id="clip-act-break"          class="clip" data-composition-id="act-break"          data-composition-src="compositions/08-act-break.html"          data-start="31.80" data-duration="5.00"  data-track-index="1"></div>
  <div id="clip-voice-link"         class="clip" data-composition-id="voice-link"         data-composition-src="compositions/09-voice-link.html"         data-start="36.80" data-duration="6.00"  data-track-index="0"></div>
  <div id="clip-recording-battery"  class="clip" data-composition-id="recording-battery"  data-composition-src="compositions/10-recording-battery.html"  data-start="42.80" data-duration="10.65" data-track-index="1"></div>
  <div id="clip-score-resolves"     class="clip" data-composition-id="score-resolves"     data-composition-src="compositions/11-score-resolves.html"     data-start="53.45" data-duration="5.00"  data-track-index="0"></div>
  <div id="clip-nurse-dashboard"    class="clip" data-composition-id="nurse-dashboard"    data-composition-src="compositions/12-nurse-dashboard.html"    data-start="58.45" data-duration="5.60"  data-track-index="1"></div>
  <div id="clip-trust-stamps"       class="clip" data-composition-id="trust-stamps"       data-composition-src="compositions/13-trust-stamps.html"       data-start="64.05" data-duration="4.50"  data-track-index="0"></div>
  <div id="clip-audit-ready-payoff" class="clip" data-composition-id="audit-ready-payoff" data-composition-src="compositions/14-audit-ready-payoff.html" data-start="68.55" data-duration="5.63"  data-track-index="1"></div>
  <div id="clip-tagline"            class="clip" data-composition-id="tagline"            data-composition-src="compositions/15-tagline.html"            data-start="74.18" data-duration="3.50"  data-track-index="0"></div>
  <div id="clip-final-card"         class="clip" data-composition-id="final-card"         data-composition-src="compositions/16-final-card.html"         data-start="77.68" data-duration="3.50"  data-track-index="1"></div>
</div>
<script>
  // Master composition has no GSAP timeline of its own — sub-compositions
  // each register their own paused timeline on window.__timelines[<slug>].
  // Hyperframes drives sub-comp clocks via the CLI clock, no JS needed here.
  // Register an empty placeholder so the lint registry check passes.
  window.__timelines = window.__timelines || {};
  window.__timelines['master'] = { seek: () => {}, pause: () => {}, play: () => {}, duration: () => 81.18 };
</script>
</body>
</html>

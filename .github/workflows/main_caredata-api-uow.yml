# Deploy Caredata-Visualization-Azure/Backend to Azure App Service caredata-api-uow.
# Portal Startup Command: bash startup.sh

name: Build and deploy Python app to Azure Web App - caredata-api-uow

on:
  push:
    branches:
      - main
    paths:
      - "Caredata-Visualization-Azure/Backend/**"
      - ".github/workflows/main_caredata-api-uow.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build deploy package (Docker = Azure-compatible native wheels)
        shell: bash
        run: |
          set -euo pipefail
          BACKEND="${GITHUB_WORKSPACE}/Caredata-Visualization-Azure/Backend"
          DEST="${GITHUB_WORKSPACE}/deploy"
          rm -rf "${DEST}"
          mkdir -p "${DEST}/python_packages/lib/site-packages"
          cp -r "${BACKEND}/app" "${DEST}/"
          cp "${BACKEND}/requirements-azure.txt" "${DEST}/requirements.txt"
          cp "${BACKEND}/requirements-azure.txt" "${DEST}/requirements-azure.txt"
          cp "${BACKEND}/startup.sh" "${DEST}/"
          cp "${BACKEND}/.deployment" "${DEST}/" 2>/dev/null || true
          chmod +x "${DEST}/startup.sh"
          test -f "${DEST}/app/main.py"
          grep -q "passlib.context" "${BACKEND}/app/core/security.py"
          ! grep -qE '^import bcrypt' "${BACKEND}/app/core/security.py"
          ! grep -qE '^(faster-whisper|torch|opensmile|spacy)' "${DEST}/requirements.txt"
          # GitHub ubuntu-latest has glibc ~2.39; Azure App Service ~2.31.
          # Install inside Debian bullseye so bcrypt/scipy/sklearn match Azure.
          docker run --rm \
            -v "${BACKEND}/requirements-azure.txt:/req.txt:ro" \
            -v "${DEST}/python_packages:/out" \
            python:3.12-slim-bullseye \
            bash -c 'set -euo pipefail && pip install -q -U pip && pip install -r /req.txt -t /out/lib/site-packages && PYTHONPATH=/out/lib/site-packages python -c "import uvicorn, gunicorn, fastapi, scipy, sklearn; from passlib.context import CryptContext; print(\"deps ok\")"'
          du -sh "${DEST}/python_packages"
          ls -la "${DEST}"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: pkg

      - name: Normalize package layout (flat wwwroot)
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          if [[ -f deploy/app/main.py ]]; then
            shopt -s dotglob
            mv deploy/* .
            rmdir deploy
          fi
          if [[ ! -f app/main.py ]]; then
            echo "Unexpected artifact layout:"
            find . -maxdepth 4 \( -name main.py -o -name requirements.txt \) 2>/dev/null || true
            ls -laR | head -80
            exit 1
          fi
          ls -la

      - name: Verify deploy layout
        working-directory: pkg
        run: |
          set -euo pipefail
          test -f app/main.py
          test -f startup.sh
          test -f requirements-azure.txt
          test -d python_packages/lib/site-packages
          grep -q "passlib.context" app/core/security.py
          ! grep -qE '^import bcrypt' app/core/security.py
          ! grep -qE '^(faster-whisper|torch|opensmile|spacy)' requirements.txt
          PYTHONPATH="$(pwd)/python_packages/lib/site-packages" python3 -c "import gunicorn, uvicorn; from passlib.context import CryptContext; print('imports ok')"
          du -sh python_packages

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C1954F22F43844B5BB952CCF5E6F74F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FC4B877AC74435F8FE3B42F91138857 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F174037B28424F3FB2740405CEFE9F09 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "caredata-api-uow"
          slot-name: "Production"
          package: pkg

      - name: Force startup command and restart
        run: |
          RG="$(az webapp list --query "[?name=='caredata-api-uow'].resourceGroup | [0]" -o tsv)"
          test -n "$RG"
          az webapp config set \
            --name caredata-api-uow \
            --resource-group "$RG" \
            --startup-file "bash startup.sh"
          az webapp restart --name caredata-api-uow --resource-group "$RG"

# Deploy Caredata-Visualization-Azure/Backend to Azure App Service caredata-api-uow.
# Site root must contain app/main.py and requirements.txt (flat layout).

name: Build and deploy Python app to Azure Web App - caredata-api-uow

on:
  push:
    branches:
      - main
    paths:
      - "Caredata-Visualization-Azure/Backend/**"
      - ".github/workflows/main_caredata-api-uow.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (smoke test)
        shell: bash
        run: |
          set -euo pipefail
          BACKEND="${GITHUB_WORKSPACE}/Caredata-Visualization-Azure/Backend"
          test -f "${BACKEND}/requirements.txt"
          test -f "${BACKEND}/app/main.py"
          cd "${BACKEND}"
          python -m pip install -r requirements.txt

      - name: Prepare flat deploy package
        shell: bash
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/Caredata-Visualization-Azure/Backend"
          DEST="${GITHUB_WORKSPACE}/deploy"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -r "${SRC}/app" "${SRC}/requirements.txt" "${SRC}/startup.sh" "${DEST}/"
          cp "${SRC}/.deployment" "${DEST}/" 2>/dev/null || true
          ls -la "${DEST}"
          test -f "${DEST}/app/main.py"
          test -f "${DEST}/requirements.txt"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Verify deploy layout (flat wwwroot)
        run: |
          test -f app/main.py
          test -f requirements.txt
          ls -la

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C1954F22F43844B5BB952CCF5E6F74F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FC4B877AC74435F8FE3B42F91138857 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F174037B28424F3FB2740405CEFE9F09 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "caredata-api-uow"
          slot-name: "Production"
          package: .

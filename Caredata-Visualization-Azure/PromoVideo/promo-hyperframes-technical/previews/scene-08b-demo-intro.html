<!doctype html>
<html lang="en" data-preview="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Section Break — System Demo | CareData Technical Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
:root {
  --paper: #FBF8F2; --paper-warm: #F6F2EB;
  --ink-900: #1F2622; --ink-700: #3D4743; --ink-500: #6B7570; --ink-300: #A4ABA4;
  --sage: #9FB4A0; --sage-ink: #4B6A55; --sage-tint: #EEF1EC;
  --clay: #C8B89B; --clay-ink: #836B47;
  --win-bg: #FFFFFF; --win-border: #E2DCCC;
}
body { background: #0E1211; display: flex; align-items: center; justify-content: center; }
.frame-wrap {
  position: relative; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; flex-shrink: 0;
  background: #0E1211;
}
.stage {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #0E1211 0%, #1A1F1B 50%, #0F1311 100%);
}
.grain {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.82 0 0 0 0 0.74 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' /></svg>");
  background-size: 420px 420px;
}
.watermark-bl { position: absolute; bottom: 36px; left: 64px; font-family: "Geist Mono", monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.20em; color: var(--ink-300); opacity: 0.55; z-index: 60; pointer-events: none; }
.watermark-tr { position: absolute; top: 42px; right: 64px; font-family: "Geist Mono", monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-300); opacity: 0.55; z-index: 60; pointer-events: none; }
#section-line { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; }
.section-number { font-family: "Geist Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.28em; color: var(--sage); text-transform: uppercase; margin-bottom: 20px; }
.section-title { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 80px; color: #FBF8F2; line-height: 1.05; letter-spacing: -0.02em; }
.section-title em { font-style: italic; color: var(--sage); }
.section-rule { width: 80px; height: 2px; background: var(--sage); margin: 28px auto 24px; }
.section-sub { font-family: "Geist", sans-serif; font-weight: 400; font-size: 22px; color: var(--ink-300); }
</style>
</head>
<body>
<div class="frame-wrap" id="frame">
  <div class="stage"></div>
  <div class="grain"></div>
  <div class="watermark-bl">CSIT321 CAPSTONE · GROUP W08 / TECHNICAL OVERVIEW</div>
  <div class="watermark-tr">SECTION 07 / SYSTEM DEMO</div>
  <div id="section-line">
    <div class="section-number">Section 07</div>
    <div class="section-title">System<br><em>Demo</em>.</div>
    <div class="section-rule"></div>
    <div class="section-sub">Login · Data Entry · QI Dashboard · Reports · Benchmarking · Voice</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async function() {
  await document.fonts.ready;
  const frame = document.getElementById('frame');
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    frame.style.zoom = s;
    frame.style.position = 'fixed';
    frame.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
    frame.style.top  = ((window.innerHeight - 1080 * s) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
  const tl = gsap.timeline();
  tl.fromTo('#section-line',
    { opacity: 0, y: 24 },
    { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' },
    0.4
  );
  tl.to({}, { duration: 10.0 }, 1.0);
})();
</script>
<script src="_nav.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Scene 8, Act Break (preview) | CareData promo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">

<style>
:root{
  --cream:#F6F2EB;
  --paper:#FBF8F2;
  --ink-900:#1F2622;
  --ink-700:#3D4743;
  --ink-500:#6B7570;
  --ink-300:#A4ABA4;
  --sage:#9FB4A0;
  --sage-bright:#B8D1B5;
  --sage-ink:#4B6A55;
  --dusty-blue:#A6B6C4;
  --clay:#C8B89B;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; }
body{
  background:#0E1211;
  color:var(--cream);
  font-family:"Geist",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

.frame-wrap{
  position:relative;
  width:1920px; height:1080px;
  transform-origin:0 0;     /* 4K canvas-fill */
}
.stage{
  position:absolute; inset:0;
  background:
    radial-gradient(70vw 60vw at 50% 50%, rgba(159,180,160,0.10), transparent 65%),
    radial-gradient(45vw 50vw at 8% 0%, rgba(200,184,155,0.05), transparent 60%),
    radial-gradient(40vw 50vw at 96% 100%, rgba(166,182,196,0.05), transparent 65%),
    linear-gradient(145deg, #0E1211 0%, #1A1F1B 50%, #0F1311 100%);
  overflow:hidden;
}

.grain{
  position:absolute; inset:0;
  pointer-events:none; opacity:0.05;
  mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.92 0 0 0 0 0.85 0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' /></svg>");
  background-size:420px 420px;
}

.footer{
  position:absolute; bottom:38px; left:60px;
  font-size:11px; letter-spacing:0.18em;
  color:var(--cream); opacity:0.45;
  z-index:60;
}

/* Two-line act break copy, centred */
.copy-block{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  text-align:center;
  z-index:10;
  white-space:nowrap;
  width:fit-content;
}

.line{
  font-family:"Instrument Serif", serif;
  font-weight:400;
  letter-spacing:-0.022em;
  line-height:1.05;
  display:block;
  opacity:0;
  will-change:transform, opacity, filter;
}

.line-1{
  font-size:96px;
  color:var(--ink-300);
  font-style:italic;
  margin-bottom:14px;
}
.line-1 .strike{
  position:relative;
  display:inline-block;
}
.line-1 .strike::after{
  content:"";
  position:absolute;
  left:-2%; right:-2%;
  top:54%;
  height:3px;
  background:var(--ink-500);
  transform-origin:left center;
  transform:scaleX(0);
}

.line-2{
  font-size:138px;
  color:var(--cream);
  font-weight:400;
  letter-spacing:-0.025em;
}
.line-2 .accent{
  font-style:italic;
  color:var(--sage-bright);
}

/* Shards — geometric fragments that fly in from the left along with the text */
.shards{
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  pointer-events:none;
  z-index:5;
}
.shard{
  position:absolute;
  background:linear-gradient(135deg, var(--sage), var(--dusty-blue));
  opacity:0;
  will-change:transform, opacity, filter;
  border-radius:1px;
  box-shadow:0 0 18px rgba(184,209,181,0.30);
}
.shard.s1{ width:120px; height:8px;  top:22%; left:32%; transform:rotate(-12deg); }
.shard.s2{ width:80px;  height:6px;  top:36%; left:58%; transform:rotate(8deg); background:linear-gradient(135deg, var(--clay), var(--sage)); }
.shard.s3{ width:200px; height:5px;  top:72%; left:30%; transform:rotate(-3deg); }
.shard.s4{ width:60px;  height:6px;  top:18%; left:64%; transform:rotate(22deg); background:linear-gradient(135deg, var(--dusty-blue), var(--sage-bright)); }
.shard.s5{ width:140px; height:7px;  top:78%; left:62%; transform:rotate(-10deg); }
.shard.s6{ width:90px;  height:5px;  top:64%; left:18%; transform:rotate(15deg); background:linear-gradient(135deg, var(--sage-bright), var(--dusty-blue)); }
.shard.s7{ width:160px; height:6px;  top:30%; left:14%; transform:rotate(5deg); }

/* Voice memo icon — flies in from camera as the text flies away */
.voice-icon{
  position:absolute;
  top:50%; left:50%;
  width:240px; height:240px;
  border-radius:50%;
  background:linear-gradient(145deg, var(--sage) 0%, var(--sage-bright) 50%, var(--dusty-blue) 100%);
  display:flex; align-items:center; justify-content:center;
  z-index:20;
  box-shadow:
    0 0 0 1px rgba(184,209,181,0.50),
    0 0 80px rgba(184,209,181,0.55),
    0 0 200px rgba(184,209,181,0.35),
    0 30px 80px rgba(0,0,0,0.40);
  opacity:0;
  will-change:transform, opacity, filter;
  transform-origin:50% 50%;
}
.voice-icon svg{
  width:120px; height:120px;
  color:var(--cream);
}
/* Animated waves around the mic — pulsing rings (hidden until activated by JS) */
.voice-rings{
  position:absolute;
  top:50%; left:50%;
  width:0; height:0;                  /* zero size so child rings can't paint anywhere */
  pointer-events:none;
  z-index:19;
  visibility:hidden;                  /* fully hidden until JS reveals during ring phase */
}
.voice-ring{
  position:absolute;
  top:0; left:0;
  width:240px; height:240px;
  border:2px solid rgba(184,209,181,0.35);
  border-radius:50%;
  opacity:0;
  will-change:transform, opacity;
}

/* Generate recording link button */
.generate-btn{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, calc(-50% + 200px));
  appearance:none; border:none;
  padding:18px 32px;
  background:var(--ink-900);
  color:var(--cream);
  font-family:"Geist", sans-serif;
  font-weight:600; font-size:18px; letter-spacing:-0.005em;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:12px;
  z-index:25;
  box-shadow:
    0 0 0 1px rgba(184,209,181,0.30),
    0 0 32px rgba(184,209,181,0.30),
    0 14px 40px rgba(0,0,0,0.40);
  opacity:0;
  white-space:nowrap;
  will-change:transform, opacity;
}
.generate-btn .pulse{
  width:9px; height:9px; border-radius:50%;
  background:var(--sage-bright);
  box-shadow:0 0 12px rgba(184,209,181,0.85);
  flex-shrink:0;
}

/* Eyebrow act-break label */
.act-label{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, calc(-50% - 230px));
  font-family:"Geist", sans-serif;
  font-weight:500;
  font-size:13px;
  letter-spacing:0.4em;
  text-transform:uppercase;
  color:var(--sage-ink);
  display:flex; align-items:center; gap:14px;
  opacity:0;
  z-index:11;
  white-space:nowrap;
}
.act-label::before, .act-label::after{
  content:"";
  width:60px; height:1px;
  background:var(--sage-ink);
  display:inline-block;
}

/* Hud */
.hud{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:rgba(15,15,17,0.85);
  color:#EAE3D2; font-family:"Geist Mono", monospace; font-size:11px;
  padding:8px 14px; border-radius:999px;
  display:flex; gap:14px; align-items:center; z-index:100;
  letter-spacing:0.06em;
}
.hud button{
  appearance:none; border:1px solid #555; background:transparent; color:#EAE3D2;
  font-family:inherit; font-size:11px; padding:3px 10px; border-radius:999px; cursor:pointer;
}
.hud button:hover{ background:#222; }
.hud .timer{ font-variant-numeric:tabular-nums; min-width:46px; }
</style>
</head>
<body>

<div class="frame-wrap" id="frame">
  <div class="stage">
    <div class="grain"></div>
    <div class="footer">CSIT321&nbsp;CAPSTONE</div>

    <!-- Act II label -->
    <div class="act-label" id="actLabel">Act II <span style="opacity:.4;">·</span> Daily care</div>

    <!-- Two-line copy -->
    <div class="copy-block" id="copyBlock">
      <span class="line line-1" id="line1"><span class="strike">Quarterly</span> is necessary.</span>
      <span class="line line-2" id="line2"><span class="accent">Daily</span> is care.</span>
    </div>

    <!-- Voice memo rings (decorative pulsing circles around the icon) -->
    <div class="voice-rings" id="voiceRings">
      <span class="voice-ring" id="ring1"></span>
      <span class="voice-ring" id="ring2"></span>
      <span class="voice-ring" id="ring3"></span>
    </div>

    <!-- Voice memo icon — flies in from camera -->
    <div class="voice-icon" id="voiceIcon">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- Microphone body -->
        <rect x="24" y="14" width="16" height="26" rx="8" fill="currentColor" stroke="none"/>
        <!-- Mic stand arc -->
        <path d="M16,30 a16,16 0 0 0 32,0"/>
        <!-- Stem + base -->
        <line x1="32" y1="46" x2="32" y2="54"/>
        <line x1="22" y1="54" x2="42" y2="54"/>
      </svg>
    </div>

    <!-- Generate recording link button -->
    <button class="generate-btn" id="generateBtn">
      <span class="pulse"></span>
      Generate recording link
    </button>
  </div>
</div>

<div class="hud">
  <button id="replay">REPLAY</button>
  <span class="timer" id="timer">0.00s</span>
  <span style="opacity:.6">Scene 08 / Act Break</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
function fit(){
  const wrap = document.getElementById('frame');
  const sx = window.innerWidth / 1920;
  const sy = window.innerHeight / 1080;
  const s = Math.min(sx, sy);
  /* zoom not transform: scale — natively rasterise at projected resolution; prevents 4K pixel break on 3D-rotated descendants. See ~/.claude/skills/hyperframes-video/rendering.md */
  wrap.style.zoom = s;
}
fit();
window.addEventListener('resize', fit);

let tl;

function build(){
  /* === Initial state — both lines off-screen LEFT, line-1 begins as full cream/normal === */
  gsap.set('#line1', { opacity: 0, x: -1400, filter: 'blur(10px)' });
  gsap.set('#line2', { opacity: 0, x: -1400, filter: 'blur(10px)' });
  gsap.set('#actLabel', { opacity: 0, x: -200, filter: 'blur(6px)' });

  /* Voice icon starts CLOSE TO CAMERA — BIG, rotating, blurred.
     Then SHRINKS to its resting size as it settles in place. */
  gsap.set('#voiceIcon', {
    xPercent: -50, yPercent: -50,
    scale: 5.5,                       /* HUGE — close to camera */
    rotation: 360,                    /* full rotation as it travels back */
    opacity: 0,
    filter: 'blur(16px)',
    transformOrigin: '50% 50%'
  });
  gsap.set(['#ring1', '#ring2', '#ring3'], {
    xPercent: -50, yPercent: -50,
    opacity: 0, scale: 1,
    transformOrigin: '50% 50%'
  });
  gsap.set('#voiceRings', { visibility: 'hidden' });   /* hidden until ring phase */
  gsap.set('#generateBtn', {
    xPercent: -50, yPercent: -50,
    opacity: 0, scale: 0.85, y: 220
  });

  /* Add a real strikethrough bar element so GSAP can scale it */
  const strike = document.querySelector('.line-1 .strike');
  if (!strike.dataset.lined) {
    const bar = document.createElement('span');
    bar.style.cssText = `
      position:absolute; left:-2%; right:-2%; top:54%;
      height:4px; background:var(--ink-500);
      transform-origin:left center; transform:scaleX(0);
      will-change:transform;
    `;
    bar.id = 'strikeBar';
    strike.appendChild(bar);
    strike.dataset.lined = '1';
  }
  gsap.set('#strikeBar', { scaleX: 0 });

  tl = gsap.timeline({
    paused: true,
    onUpdate: () => {
      document.getElementById('timer').textContent = tl.time().toFixed(2) + 's';
    }
  });

  /* ============================================================
     TOTAL ~5.0s — beat-locked at 120 BPM
        b1  0.00      Both lines + label slide in TOGETHER from the left
        b2  0.50      All settled — full text reads
        b3  1.00      Strikethrough draws across "Quarterly" + Line 1 dims
        b4  1.50      "Daily is care." stands alone, struck Line 1 ghosted
        b5  2.00      Exit STARTS — text rotates + scales DOWN + flies away
                      Voice icon begins flying IN from far (rotating)
        b6  2.50      Text gone, voice icon mid-flight (still rotating)
        b7  3.00      Voice icon settles in centre, rotation completes
        b8  3.50      Pulsing rings emanate around the voice icon
        b9  4.00      "Generate recording link" button slides up beneath
        b10 4.50      Hold for the click moment
        b11 5.00      Scene end (Scene 9 picks up from this state)
     ============================================================ */

  /* === Phase A (b1-b2): Full composition slides in from LEFT, FAST === */
  tl.to('#actLabel', {
    opacity: 1, x: 0,
    filter: 'blur(0px)',
    duration: 0.40, ease: 'cubic-bezier(.22,.85,.30,1)'
  }, 0.00);

  tl.to('#line1', {
    opacity: 1, x: 0,
    filter: 'blur(0px)',
    duration: 0.40, ease: 'cubic-bezier(.22,.85,.30,1)'
  }, 0.05);

  tl.to('#line2', {
    opacity: 1, x: 0,
    filter: 'blur(0px)',
    duration: 0.40, ease: 'cubic-bezier(.22,.85,.30,1)'
  }, 0.10);

  /* === Phase B (b2-b3): Hold full text — audience reads === */

  /* === Phase C (b3): Strikethrough draws + Line 1 dims/blurs === */
  tl.to('#strikeBar', {
    scaleX: 1,
    duration: 0.36, ease: 'power3.out'
  }, 1.00);
  tl.to('#line1', {
    opacity: 0.45,
    filter: 'blur(2px)',
    duration: 0.40, ease: 'power2.out'
  }, 1.05);

  /* === Phase D (b4): "Daily is care." stands strong while Line 1 fades to ghost === */

  /* === Phase E (b5–b6): Text ROTATES + SHRINKS away, voice icon FLIES IN from far === */
  /* Act label fades quickly */
  tl.to('#actLabel', {
    opacity: 0, x: 200, filter: 'blur(6px)',
    duration: 0.30, ease: 'power3.in'
  }, 2.00);

  /* Both text lines tumble away (rotate Z + scale down + blur + fade) */
  tl.to('#copyBlock', {
    rotation: -28,
    scale: 0.04,
    filter: 'blur(8px)',
    opacity: 0,
    duration: 0.80, ease: 'power3.in',
    transformOrigin: '50% 50%'
  }, 2.00);

  /* Voice icon: fades opacity in immediately, then SHRINKS from BIG to resting size
     while continuing to rotate to 0°. Ends settled in place. */
  tl.to('#voiceIcon', {
    opacity: 1,
    duration: 0.20, ease: 'power2.out'
  }, 2.20);
  tl.to('#voiceIcon', {
    scale: 1.0,
    rotation: 0,
    filter: 'blur(0px)',
    duration: 1.00, ease: 'power3.out'
  }, 2.20);

  /* Reveal the rings container only when the ring phase is about to start */
  tl.set('#voiceRings', { visibility: 'visible' }, 3.25);

  /* === Phase F (b7-b8): Pulsing sage rings emanate from the icon === */
  tl.fromTo('#ring1',
    { opacity: 0.55, scale: 1 },
    { opacity: 0, scale: 1.7, duration: 0.90, ease: 'power2.out' }, 3.30);
  tl.fromTo('#ring2',
    { opacity: 0.45, scale: 1 },
    { opacity: 0, scale: 2.1, duration: 0.90, ease: 'power2.out' }, 3.50);
  tl.fromTo('#ring3',
    { opacity: 0.30, scale: 1 },
    { opacity: 0, scale: 2.5, duration: 0.90, ease: 'power2.out' }, 3.70);

  /* === Phase G (b9): "Generate recording link" button slides up beneath the icon === */
  tl.to('#generateBtn', {
    opacity: 1, scale: 1.0, y: 200,
    duration: 0.45, ease: 'back.out(1.4)'
  }, 4.00);
}

function play(){
  if (!tl) build();
  tl.restart();
  tl.play();
}

document.getElementById('replay').addEventListener('click', play);

// IFRAME-AWARE BOOTSTRAP — patched by shared/patch-scenes.mjs
window.addEventListener('load', () => {
  const start = () => { build(); if (window.parent === window) play(); };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
  } else {
    start();
  }
});
window.addEventListener('message', (e) => {
  const t = e.data && e.data.type;
  if (t === 'play'  && typeof play === 'function')                          play();
  if (t === 'pause' && typeof tl   !== 'undefined' && tl)                    tl.pause();
  if (t === 'reset' && typeof tl   !== 'undefined' && tl) { tl.seek(0); tl.pause(); }
});
</script>
</body>
</html>
